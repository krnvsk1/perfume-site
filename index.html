<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Распив духов</title>
<meta name="description" content="Оригинальные ароматы на распив от 1 мл или целым флаконом.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="badge" id="demoBadge" hidden>Демо-режим</div>
      <h1 id="shopName">Распив духов</h1>
      <p class="sub">Оригинальные ароматы на распив от 1 мл или целым флаконом. Уровень во флаконе показывает, сколько осталось.</p>
    </div>
  </header>
  <main><div class="grid" id="grid"><p class="empty">Загружаю ароматы…</p></div></main>
  <footer id="demoFooter" hidden>
    <span>Демо: данные хранятся только в этом браузере.</span>
    <button class="btn ghost small" id="reset" type="button">Сбросить демо</button>
  </footer>
</div>

<div class="veil" id="veil" hidden>
  <form class="sheet" id="orderForm" novalidate>
    <div><div class="house" id="o-house"></div><h2 id="o-name"></h2></div>
    <div class="seg">
      <button type="button" id="m-ml" aria-pressed="true">На распив</button>
      <button type="button" id="m-full" aria-pressed="false">Полный флакон</button>
    </div>
    <label id="mlWrap">Сколько миллилитров<input id="o-ml" type="number" min="1" step="1" value="5" inputmode="numeric"></label>
    <div class="total"><span id="o-hint" class="notes"></span><b id="o-total"></b></div>
    <label>Имя<input id="o-cust" autocomplete="name"></label>
    <label>Телефон<input id="o-phone" type="tel" autocomplete="tel" placeholder="+7 900 000-00-00"></label>
    <p class="err" id="o-err"></p>
    <div class="row">
      <button class="btn ghost" type="button" id="o-cancel">Отмена</button>
      <button class="btn" type="submit" id="o-submit">Отправить заявку</button>
    </div>
  </form>
</div>
<div class="toast" id="toast" hidden></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="store.js"></script>
<script>
const $ = id => document.getElementById(id);
let items = [], cur = null, full = false;
if (APP_CONFIG.SHOP_NAME) { $("shopName").textContent = APP_CONFIG.SHOP_NAME; document.title = APP_CONFIG.SHOP_NAME; }
$("demoBadge").hidden = $("demoFooter").hidden = Store.live;

function bottle(p) {
  const pct = Math.max(0, Math.min(100, p.ml_left / p.bottle_volume * 100));
  return p.photo_url ? `<img src="${esc(p.photo_url)}" alt="${esc(p.name)}" loading="lazy">`
    : `<div class="bottle"><div class="cap"></div><div class="neck"></div><div class="flask"><div class="liquid" style="height:${pct}%;background:${esc(p.color || "#6E3F84")}"></div></div></div>`;
}
async function render() {
  try { items = await Store.list(); } catch (e) { $("grid").innerHTML = `<p class="empty">Не удалось загрузить каталог: ${esc(e.message)}</p>`; return; }
  if (!items.length) { $("grid").innerHTML = `<p class="empty">Скоро здесь появятся ароматы.</p>`; return; }
  $("grid").innerHTML = items.map(p => {
    const pct = Math.max(0, Math.min(100, p.ml_left / p.bottle_volume * 100)), out = p.ml_left <= 0;
    return `<article class="card">
      <div class="stage">${bottle(p)}</div>
      <div><div class="house">${esc(p.house)}</div><h3 class="name">${esc(p.name)}</h3></div>
      <p class="notes">${esc(p.description)}</p>
      <div><div class="left ${out ? "sold" : ""}">${out ? "Закончился" : `Осталось ${p.ml_left} из ${p.bottle_volume} мл`}</div><div class="gauge"><i style="width:${pct}%"></i></div></div>
      <div class="prices"><div><b>${fmtMoney(p.price_per_ml)}</b><span>за 1 мл</span></div><div style="text-align:right"><b>${p.bottle_price ? fmtMoney(p.bottle_price) : "—"}</b><span>флакон ${p.bottle_volume} мл</span></div></div>
      <button class="btn" data-buy="${esc(p.id)}" ${out ? "disabled" : ""}>${out ? "Нет в наличии" : "Заказать"}</button>
    </article>`;
  }).join("");
}

function openOrder(id) {
  cur = items.find(p => String(p.id) === id);
  $("o-house").textContent = cur.house || ""; $("o-name").textContent = cur.name;
  $("o-ml").max = cur.ml_left; $("o-ml").value = Math.min(5, cur.ml_left);
  $("m-full").disabled = !cur.bottle_price || cur.ml_left < cur.bottle_volume;
  $("m-full").title = $("m-full").disabled ? "Флакон уже начат" : "";
  $("o-err").textContent = ""; setMode(false); $("veil").hidden = false; $("o-ml").focus();
}
function setMode(f) { full = f; $("m-ml").setAttribute("aria-pressed", !f); $("m-full").setAttribute("aria-pressed", f); $("mlWrap").hidden = f; calc(); }
function calc() {
  if (!cur) return;
  if (full) { $("o-total").textContent = fmtMoney(cur.bottle_price); $("o-hint").textContent = `Целый флакон ${cur.bottle_volume} мл`; return; }
  const ml = Math.floor(+$("o-ml").value || 0);
  $("o-total").textContent = fmtMoney(ml * cur.price_per_ml);
  $("o-hint").textContent = `${ml} мл × ${fmtMoney(cur.price_per_ml)}`;
}
$("grid").addEventListener("click", e => { const b = e.target.closest("[data-buy]"); if (b) openOrder(b.dataset.buy); });
$("m-ml").onclick = () => setMode(false); $("m-full").onclick = () => setMode(true);
$("o-ml").oninput = calc;
$("o-cancel").onclick = () => $("veil").hidden = true;
$("veil").addEventListener("click", e => { if (e.target.id === "veil") $("veil").hidden = true; });
document.addEventListener("keydown", e => { if (e.key === "Escape") $("veil").hidden = true; });

$("orderForm").addEventListener("submit", async e => {
  e.preventDefault();
  const ml = Math.floor(+$("o-ml").value || 0), name = $("o-cust").value.trim(), phone = $("o-phone").value.trim();
  if (!full && ml < 1) return $("o-err").textContent = "Укажи объём от 1 мл.";
  if (!full && ml > cur.ml_left) return $("o-err").textContent = `В наличии только ${cur.ml_left} мл. Уменьши объём.`;
  if (!name || phone.replace(/\D/g, "").length < 10) return $("o-err").textContent = "Заполни имя и телефон, чтобы продавец мог связаться.";
  $("o-submit").disabled = true;
  try {
    const res = await Store.placeOrder(cur.id, name, phone, ml, full);
    if (res !== "ok") { $("o-err").textContent = res; return; }
    $("veil").hidden = true; toast("Заявка отправлена. Продавец скоро свяжется с тобой."); render();
  } catch (err) { $("o-err").textContent = "Не получилось отправить: " + err.message; }
  finally { $("o-submit").disabled = false; }
});
let tt; function toast(t) { $("toast").textContent = t; $("toast").hidden = false; clearTimeout(tt); tt = setTimeout(() => $("toast").hidden = true, 3200); }
$("reset").onclick = () => { Store.reset(); render(); toast("Демо сброшено"); };
render();
</script>
</body>
</html>
